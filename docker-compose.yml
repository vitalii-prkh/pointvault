# Local stack. `npm run db:up` starts only the databases (for `npm run dev:api` and the e2e tests);
# `npm run stack:up` also builds and starts the API container.
name: pointvault

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pointvault
      POSTGRES_PASSWORD: pointvault
      POSTGRES_DB: pointvault
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pointvault -d pointvault']
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: applies Prisma migrations, then exits. The api waits for it to succeed.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://pointvault:pointvault@postgres:5432/pointvault
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: pointvault-api:local
    environment:
      DATABASE_URL: postgresql://pointvault:pointvault@postgres:5432/pointvault
      MONGODB_URI: mongodb://mongo:27017/pointvault
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Compose-level check uses /readyz, so `up --wait` returns only when the API can reach both databases.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
