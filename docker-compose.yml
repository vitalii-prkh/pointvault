# Local databases for development and e2e tests. The API itself joins this file in Phase 3.
name: pointvault

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pointvault
      POSTGRES_PASSWORD: pointvault
      POSTGRES_DB: pointvault
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pointvault -d pointvault']
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  mongo-data:
